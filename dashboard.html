<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Cadastro de Vendedores</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="dashboard-body">
    <div class="background-elements">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <div class="dashboard-container">
        <header class="dashboard-header" style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem; width: 100%;">
            <div style="display: flex; align-items: center; justify-content: flex-start;">
                <img src="logoregata.png" alt="Logo Regata" style="max-height: 100px; width: auto; object-fit: contain;">
            </div>
            <div class="dashboard-title-area" style="text-align: center;">
                <h1 style="margin-bottom: 0.2rem;">Painel Administrativo</h1>
                <p class="subtitle">Gestão de Vendedores Ambulantes</p>
            </div>
            <div class="dashboard-actions" style="display: flex; justify-content: flex-end; align-items: center; gap: 1rem;">
                <img src="image1.png" alt="Logo SETUR" style="max-height: 130px; width: auto; object-fit: contain; border-radius: 8px;">
                <a href="index.html" class="btn btn-secondary">Voltar ao Site</a>
                <button id="refreshBtn" class="btn btn-primary">🔄 Atualizar Lista</button>
            </div>
        </header>

        <main class="dashboard-main">
            <div class="table-container">
                <div class="table-header">
                    <h2>Cadastros Recentes</h2>
                    <div class="table-stats">
                        Total: <span id="totalCount">0</span>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="data-table" id="vendorsTable">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>Telefone</th>
                                <th>Local</th>
                                <th>Tipo</th>
                                <th>Data Cadastro</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="7" class="text-center">Carregando dados...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de Edição -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Editar Vendedor</h2>
            <form id="editForm">
                <input type="hidden" id="edit_id" name="id">
                
                <section class="form-section">
                    <h3><span class="icon">👤</span> Dados Pessoais</h3>
                    <div class="form-grid">
                        <div class="input-group full-width">
                            <label for="edit_nome">Nome Completo</label>
                            <input type="text" id="edit_nome" name="nome" required>
                        </div>
                        <div class="input-group">
                            <label for="edit_cpf">CPF</label>
                            <input type="text" id="edit_cpf" name="cpf" required>
                        </div>
                        <div class="input-group">
                            <label for="edit_identidade">Identidade (RG)</label>
                            <input type="text" id="edit_identidade" name="identidade" required>
                        </div>
                        <div class="input-group">
                            <label for="edit_data_nascimento">Data de Nascimento</label>
                            <input type="date" id="edit_data_nascimento" name="data_nascimento" required>
                        </div>
                        <div class="input-group">
                            <label for="edit_telefone">Telefone (WhatsApp)</label>
                            <input type="tel" id="edit_telefone" name="telefone" required>
                        </div>
                    </div>
                </section>

                <section class="form-section">
                    <h3><span class="icon">📍</span> Endereço</h3>
                    <div class="form-grid">
                        <div class="input-group full-width">
                            <label for="edit_endereco">Endereço Completo</label>
                            <input type="text" id="edit_endereco" name="endereco" required>
                        </div>
                        <div class="input-group">
                            <label for="edit_bairro">Bairro</label>
                            <input type="text" id="edit_bairro" name="bairro" required>
                        </div>
                        <div class="input-group">
                            <label for="edit_cidade">Cidade</label>
                            <input type="text" id="edit_cidade" name="cidade" required>
                        </div>
                    </div>
                </section>

                <section class="form-section">
                    <h3><span class="icon">⛺</span> Informações da Vaga</h3>
                    <div class="form-grid">
                        <div class="input-group">
                            <label for="edit_localizacao">Local Pretendido</label>
                            <select id="edit_localizacao" name="localizacao" required>
                                <option value="" disabled>Selecione um local</option>
                                <option value="Paraipaba">Paraipaba</option>
                                <option value="Lagoinha">Lagoinha</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="edit_numero_vaga">Nº da Vaga</label>
                            <input type="text" id="edit_numero_vaga" name="numero_vaga">
                        </div>
                    </div>
                </section>

                <section class="form-section">
                    <h3><span class="icon">🛍️</span> Produtos e Estrutura</h3>
                    <div class="form-group checkbox-group-container">
                        <label class="group-label">Produtos Comercializados</label>
                        <div class="checkbox-grid">
                            <label class="checkbox-label"><input type="checkbox" name="edit_produtos" value="Comidas"> Comidas</label>
                            <label class="checkbox-label"><input type="checkbox" name="edit_produtos" value="Bebidas"> Bebidas/Drinks</label>
                            <label class="checkbox-label"><input type="checkbox" name="edit_produtos" value="Brinquedos"> Brinquedos</label>
                            <label class="checkbox-label"><input type="checkbox" name="edit_produtos" value="Outro"> Outro</label>
                        </div>
                    </div>
                    <div class="form-grid mt-4">
                        <div class="input-group">
                            <label for="edit_tipo_instalacao">Tipo de Instalação</label>
                            <select id="edit_tipo_instalacao" name="tipo_instalacao" required>
                                <option value="" disabled>Selecione</option>
                                <option value="Barraca">Barraca</option>
                                <option value="Carrinho">Carrinho</option>
                                <option value="Isopor">Isopor</option>
                                <option value="Mesas">Mesas</option>
                            </select>
                        </div>
                        <div class="input-group" id="edit_containerMesas" style="display: none;">
                            <label for="edit_quantidade_mesas">Quantidade de Mesas</label>
                            <input type="number" id="edit_quantidade_mesas" name="quantidade_mesas" min="1">
                        </div>
                    </div>
                </section>

                <button type="submit" id="editSubmitBtn" class="submit-btn">
                    <span class="btn-text">Salvar Alterações</span>
                    <span class="loader" style="display: none;"></span>
                </button>
                <div id="editFeedbackMessage" class="feedback-message"></div>
            </form>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
