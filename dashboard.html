<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Cadastro de Vendedores</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="dashboard-body">
    <div class="background-elements">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="dashboard-title-area" style="display: flex; align-items: center; gap: 1.5rem;">
                <img src="image1.png" alt="Logo SETUR" style="max-height: 80px; border-radius: 8px;">
                <div>
                    <h1>Painel Administrativo</h1>
                    <p class="subtitle">Gestão de Vendedores Ambulantes</p>
                </div>
            </div>
            <div class="dashboard-actions">
                <input type="text" id="searchInput" placeholder="Buscar por nome..." class="search-input">
                <a href="index.html" class="btn btn-secondary">Voltar ao Site</a>
                <button id="refreshBtn" class="btn btn-primary">🔄 Atualizar Lista</button>
            </div>
        </header>

        <main class="dashboard-main">
            <div class="table-container">
                <div class="table-header">
                    <h2>Cadastros Recentes</h2>
                    <div class="table-stats">
                        Total: <span id="totalCount">0</span>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="data-table" id="vendorsTable">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>Telefone</th>
                                <th>Local</th>
                                <th>Tipo</th>
                                <th>Data Cadastro</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="7" class="text-center">Carregando dados...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Vendedor</h2>
                <button id="closeModalBtn" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" id="editId">
                    <div class="form-grid" style="gap: 1rem;">
                        <div class="form-group full-width">
                            <label>Nome Completo</label>
                            <input type="text" id="editNome" required>
                        </div>
                        <div class="form-group">
                            <label>Identidade</label>
                            <input type="text" id="editIdentidade" required>
                        </div>
                        <div class="form-group">
                            <label>CPF</label>
                            <input type="text" id="editCpf" required>
                        </div>
                        <div class="form-group">
                            <label>Data de Nascimento</label>
                            <input type="date" id="editDataNascimento" required>
                        </div>
                        <div class="form-group">
                            <label>Telefone</label>
                            <input type="text" id="editTelefone" required>
                        </div>
                        <div class="form-group full-width">
                            <label>Endereço</label>
                            <input type="text" id="editEndereco" required>
                        </div>
                        <div class="form-group">
                            <label>Bairro</label>
                            <input type="text" id="editBairro" required>
                        </div>
                        <div class="form-group">
                            <label>Cidade</label>
                            <input type="text" id="editCidade" required>
                        </div>
                        <div class="form-group">
                            <label>Localização</label>
                            <select id="editLocalizacao" required>
                                <option value="Paraipaba">Paraipaba</option>
                                <option value="Lagoinha">Lagoinha</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Número da Vaga</label>
                            <input type="text" id="editNumeroVaga">
                        </div>
                        <div class="form-group">
                            <label>Tipo de Instalação</label>
                            <select id="editTipo" required>
                                <option value="Barraca">Barraca</option>
                                <option value="Carrinho">Carrinho</option>
                                <option value="Isopor">Isopor</option>
                                <option value="Mesas">Mesas</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Quant. de Mesas</label>
                            <input type="number" id="editQtdMesas" min="0">
                        </div>
                    </div>
                    <div class="form-actions" style="margin-top: 1.5rem; display: flex; gap: 1rem; justify-content: flex-end;">
                        <button type="button" id="cancelEditBtn" class="btn btn-secondary">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
